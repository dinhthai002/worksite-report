# Dependabot version updates (architecture.md section 9). Security updates are a repository setting:
# Settings → Code security → Dependabot security updates.
# Minor and patch updates are grouped into one pull request per ecosystem; majors arrive one by one.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node.js 22 is pinned in .nvmrc, package.json engines and the Dockerfile; its types follow it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A new Node.js major also changes .nvmrc and package.json engines, so it is upgraded by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A new PostgreSQL major needs a data migration. test/test-database.ts pins the same image by hand.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
