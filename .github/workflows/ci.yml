# CI (architecture.md section 9): one workflow on every push and pull request. All steps must pass.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # postinstall runs `prisma generate`, which the typecheck needs.
      - name: Install dependencies
        run: npm ci

      # Production dependencies only: dev tools never reach the image. package.json `overrides` patches
      # advisories in Prisma 6's own dependencies.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and format
        run: npm run lint

      - name: Architecture
        run: npm run arch

      - name: Unit tests
        run: npm test

      # Testcontainers starts PostgreSQL with the runner's Docker.
      - name: Integration and API tests
        run: npx jest --selectProjects integration api --runInBand

      - name: Docker build
        run: docker build --tag worksite-report:ci .

      # Fails on a HIGH or CRITICAL vulnerability that has a fix, in OS packages or node_modules.
      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: worksite-report:ci
          version: v0.76.2
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
