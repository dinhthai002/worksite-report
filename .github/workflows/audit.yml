# Weekly audit of production dependencies (architecture.md section 9). It does not run on push, so it never
# blocks a commit; a failed run is the signal. It moves into ci.yml as a blocking step once it passes,
# which needs Prisma 7 (prisma 6 pulls in deepmerge-ts and effect with high-severity advisories).
name: audit

on:
  schedule:
    - cron: "37 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # npm audit reads package-lock.json, so no install is needed.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
