# Runs the whole application: `docker compose up --build` (architecture.md section 9).
# The credentials below are local development defaults, not secrets (CFG-02).

name: site-daily-report

x-app-environment: &app-environment
  DATABASE_URL: postgresql://postgres:postgres@db:5432/site_daily_report
  PORT: "3000"
  BACKDATE_LIMIT_DAYS: "5"
  APP_TIME_ZONE: Asia/Ho_Chi_Minh
  LOG_LEVEL: info

services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: site_daily_report
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d site_daily_report"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies migrations once, then exits. The seed step is added together with the first models.
  migrate:
    build: .
    image: site-daily-report:local
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: site-daily-report:local
    environment: *app-environment
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db-data:
