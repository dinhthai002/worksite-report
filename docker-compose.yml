# Runs the whole application: `docker compose up --build` (architecture.md section 8).
# The credentials below are local development defaults, not secrets (CFG-02).

name: worksite-report

x-app-environment: &app-environment
  DATABASE_URL: postgresql://postgres:postgres@db:5432/worksite_report
  PORT: "3000"
  BACKDATE_LIMIT_DAYS: "5"
  APP_TIME_ZONE: Asia/Ho_Chi_Minh
  LOG_LEVEL: info

services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: worksite_report
    # Host port for local tools (prisma migrate dev, psql). Set DB_PORT in .env when 5432 is taken.
    # The api and migrate services always reach the database inside the network at db:5432.
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d worksite_report"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Applies migrations, then fills in the PRD example rows that are missing (prisma/seed.ts, fill mode), then
  # exits. Existing data is never changed. To reset the example: `npx prisma db seed`, or
  # `docker compose run --rm migrate node dist/prisma/seed.js --reset`.
  migrate:
    build: .
    image: worksite-report:local
    command: ["sh", "-c", "node_modules/.bin/prisma migrate deploy && node dist/prisma/seed.js"]
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: worksite-report:local
    environment: *app-environment
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  db-data:
